# Local development build. No .env or manual model file required.
# The published-image deployment uses compose.yaml; this file is for tests.
name: nemotron-asr-dev-two
services:
  engine:
    image: nemotron-asr-engine:0.1.0-cuda
    build: ./engine
    gpus: all
    depends_on:
      gateway:
        condition: service_healthy
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --asr-model
      - /models/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf
      - --no-ui
    volumes:
      - model:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: [CMD, nemo-speech, health, --quiet]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped
    networks: [internal]

  gateway:
    image: nemotron-asr-gateway:0.4.0
    build: ./gateway
    user: "0:0"
    volumes:
      - model:/models
      - auth:/run/asr-auth
    ports:
      - "127.0.0.1:18091:8080"
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    healthcheck:
      test: [CMD, python, -c, "import socket;socket.create_connection(('127.0.0.1',8080),timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10m
    restart: unless-stopped
    networks: [internal, public]

networks:
  internal:
    internal: true
  public:

volumes:
  model:
  auth:
